# Local DynamoDB for development and the integration suite.
# Fixed host port so the contract's start command and the environment
# variable file agree on where DYNAMODB_ENDPOINT points.
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
